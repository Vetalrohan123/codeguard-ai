services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeguard
      POSTGRES_PASSWORD: codeguard
      POSTGRES_DB: codeguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U codeguard -d codeguard"],interval: 5s,timeout: 5s,retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  frontend:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {pgdata: {}}
